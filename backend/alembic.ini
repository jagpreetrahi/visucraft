[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = postgresql://myuser:jaggi123@localhost:5432/visual_craft

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatter]
keys = generic

[logger_root]
level = WARN
handlers = console
qualName = 

[logger_sqlalchemy]
level = WARN
handlers = 
qualName = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = 
qualName = alembic 

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname) - 5.5s [%(name)s] %(message)s 
datefmt  = %H:%M:%S
