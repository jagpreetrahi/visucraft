services:
    postgres:
      image: postgres:16-alpine
      restart: unless-stopped
      environment:
        POSTGRES_USER: myuser
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: visual_craft
      ports:
        - "5433:5432"
      volume: 
        - pgdata:/var/lib/postgresql/data    

volumes:
  pgdata:        
